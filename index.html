<title>HASHLING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* layout: a late-80s workbench desktop (blue, white, orange, black) that hatches out of a pocket pet. every app on it reads real Solana data; the ones that write (revoke, reclaim, send) are signed by the visitor's own wallet */
:root{
  --desk:#1d4f9c;--desk2:#173f7e;--white:#f2f1ec;--paper:#e6e3d8;--grey:#b9b6ac;--ink:#0b0b10;--mut:#5c5a66;
  --org:#ff8a1f;--org2:#ffb35c;--blu:#1d4f9c;--sky:#64b6ff;--grn:#2fd27a;--red:#ff4b55;--yel:#ffd23f;
  --t:'Silkscreen','Courier New',monospace;--m:'VT323',ui-monospace,monospace;--b:'Pixelify Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--desk);color:var(--ink);font-family:var(--b);-webkit-font-smoothing:none}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:inherit}
::selection{background:var(--org);color:var(--ink)}
canvas{image-rendering:pixelated}

/* ---------- boot: pocket pet ---------- */
#boot{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 40%,#22262f,#07080b 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .6s}
#boot.off{opacity:0;pointer-events:none}
.egg{position:relative;width:min(330px,74vw);height:calc(min(330px,74vw) / .82);border-radius:50% 50% 47% 47%/58% 58% 42% 42%;background:radial-gradient(circle at 34% 26%,#ffd7a8,#ff8a1f 45%,#c95a00 100%);box-shadow:inset -14px -18px 0 rgba(0,0,0,.18),inset 10px 10px 0 rgba(255,255,255,.18),0 30px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:6%}
.egg.shake{animation:shake .4s steps(4) infinite}
@keyframes shake{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.lcdw{width:62%;height:calc(min(330px,74vw) * .56);background:#1b1c22;border-radius:12px;padding:8%;box-shadow:inset 0 0 0 4px #000,inset 0 0 0 6px #3a3c46}
#lcd{width:100%;height:100%;display:block;background:#9fbf74;image-rendering:pixelated}
.btns3{display:flex;gap:16px;margin-top:9%}
.btns3 button{width:30px;height:30px;border-radius:50%;background:#1d4f9c;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),0 3px 0 #0b2a5a}
.btns3 button:active{transform:translateY(2px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.35)}
.btns3 button.a{background:var(--yel)}
.egg .brand{position:absolute;bottom:10%;font-family:var(--t);font-weight:700;font-size:13px;color:#7a3300;letter-spacing:.12em}
.bootT{font-family:var(--t);font-weight:700;color:var(--white);font-size:clamp(28px,5vw,46px);letter-spacing:.06em;text-shadow:4px 4px 0 var(--org)}
.bootS{font-family:var(--m);font-size:22px;color:#9aa0b0;text-align:center}
.bootS b{color:var(--yel);font-weight:400}
#skip{position:fixed;right:18px;bottom:16px;z-index:201;font-family:var(--t);font-size:12px;color:#9aa0b0}
#skip:hover{color:var(--white)}
#sndB{position:fixed;left:18px;bottom:16px;z-index:201;font-family:var(--t);font-size:12px;color:#9aa0b0}

/* ---------- screen bar (top) ---------- */
#bar{position:fixed;left:0;right:0;top:0;height:30px;z-index:90;background:var(--white);border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:4px;padding:0 6px;font-family:var(--t);font-size:12px}
#bar .logo{display:flex;align-items:center;gap:6px;font-weight:700;padding:0 8px 0 2px}
#bar .mi{padding:4px 9px;position:relative}
#bar .mi:hover,#bar .mi.on{background:var(--ink);color:var(--white)}
#bar .sp{flex:1}
#bar .pill{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);padding:1px 8px;background:var(--paper);font-family:var(--m);font-size:17px;white-space:nowrap}
#bar .pill.btn{background:var(--org);cursor:pointer;font-family:var(--t);font-size:11px;padding:3px 8px}
#bar .pill.btn:hover{background:var(--org2)}

let WAL=null;
function providers(){const L=[];const ph=window.phantom?.solana||(window.solana?.isPhantom?window.solana:null);if(ph)L.push(['Phantom',ph]);if(window.solflare?.isSolflare)L.push(['Solflare',window.solflare]);if(window.backpack?.solana||window.backpack?.isBackpack)L.push(['Backpack',window.backpack?.solana||window.backpack]);return L}

function connect(after){const P=providers();modal('Connect wallet',`<p style="font-size:14px;line-height:1.5">Connecting shares your <b>public address</b> so the apps can read it. Nothing is ever signed unless you press a button that says so (revoke, reclaim or send), and your wallet shows every transaction first. Hashling never asks for a seed phrase.</p>
 <div class="wl">${P.map(([n])=>`<button data-w="${n}">${n}<span>detected</span></button>`).join('')}${[['Phantom','https://phantom.com/download'],['Solflare','https://solflare.com/download'],['Backpack','https://backpack.app/download']].filter(([n])=>!P.find(p=>p[0]===n)).map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n}<span>install ↗</span></a>`).join('')}</div><p class="lbl">On a phone, open this site inside your wallet app's browser.</p>`);
 $$('#mB [data-w]').forEach(b=>b.onclick=async()=>{const p=providers().find(x=>x[0]===b.dataset.w)[1];try{const r=await p.connect();WAL={name:b.dataset.w,p,pk:(r?.publicKey||p.publicKey).toString()};store.set('wal',WAL.name);closeModal();paintWal();toast(`Connected <b>${short(WAL.pk)}</b>`,'ok');beep(880,.08);p.on?.('accountChanged',pk=>{if(pk){WAL.pk=pk.toString();paintWal()}else disconnect()});if(after)after(WAL.pk)}catch(e){toast('Connection cancelled.','bad')}})}
async function restoreWal(){const n=store.get('wal');if(!n)return;const p=providers().find(x=>x[0]===n)?.[1];if(!p)return;try{const r=await p.connect({onlyIfTrusted:true});WAL={name:n,p,pk:(r?.publicKey||p.publicKey).toString()};paintWal()}catch(e){}}

async function sendTx(ixs,label){const W=await w3();if(!WAL)throw new Error('Connect a wallet first.');const owner=new W.PublicKey(WAL.pk);const bh=await rpc('getLatestBlockhash',[{commitment:'confirmed'}]);
 const msg=new W.TransactionMessage({payerKey:owner,recentBlockhash:bh.value.blockhash,instructions:[W.ComputeBudgetProgram.setComputeUnitPrice({microLamports:20000}),...ixs]}).compileToV0Message();const tx=new W.VersionedTransaction(msg);
 let sig;if(WAL.p.signAndSendTransaction){const r=await WAL.p.signAndSendTransaction(tx);sig=r?.signature||r}else{const s=await WAL.p.signTransaction(tx);sig=await rpc('sendTransaction',[toB64(s.serialize()),{encoding:'base64',maxRetries:5}])}
 if(typeof sig!=='string'){const B=await import('https://cdn.jsdelivr.net/npm/bs58@6.0.0/+esm');sig=B.default.encode(new Uint8Array(sig))}
 toast(`${esc(label)} sent. <a href="https://solscan.io/tx/${sig}" target="_blank" rel="noopener">Solscan</a>`);

const META=new Map();
async function tokenMeta(mints){const need=mints.filter(m=>!META.has(m));for(let i=0;i<need.length;i+=80){const ch=need.slice(i,i+80);try{const arr=await getJSON(API.tok+ch.join(','));arr.forEach(t=>META.set(t.id,t))}catch(e){}ch.forEach(m=>{if(!META.has(m))META.set(m,null)})}return mints.map(m=>META.get(m))}
async function readWallet(addr,log=()=>{}){const R={addr};
 log('reading account…');const ai=await rpc('getAccountInfo',[addr,{encoding:'jsonParsed'}]);R.exists=!!ai.value;R.owner=ai.value?.owner||SYS;R.lamports=ai.value?.lamports||0;R.executable=!!ai.value?.executable;R.parsedType=ai.value?.data?.parsed?.type||null;R.sol=R.lamports/1e9;
 log('reading holdings…');let h=null;try{h=await getJSON(API.hold+addr)}catch(e){R.holdErr=true;log('token holdings unavailable for this wallet ('+e.message+'); continuing with SOL and history')}
 R.accts=[];if(h?.tokens)for(const [mint,arr] of Object.entries(h.tokens))for(const t of arr)R.accts.push({mint,...t,ui:+t.uiAmount||0});
 const mints=[...new Set(R.accts.map(a=>a.mint))];log(`found ${R.accts.length} token accounts across ${mints.length} mints`);
 const pos=new Set(R.accts.filter(a=>a.ui>0).map(a=>a.mint));const lk=[...mints].sort((a,b)=>pos.has(b)-pos.has(a)).slice(0,400);const metas=await tokenMeta(lk);const mm=new Map(lk.map((m,i)=>[m,metas[i]]));
 R.accts.forEach(a=>{const m=mm.get(a.mint);a.meta=m;a.symbol=m?.symbol||null;a.name=m?.name||null;a.icon=m?.icon||null;a.price=m?.usdPrice||0;a.value=a.ui*(a.price||0);a.verified=!!m?.isVerified;a.pump=a.mint.endsWith('pump')});
 await solPrice();R.solUsd=R.sol*(SOLUSD||0);R.tokUsd=R.accts.reduce((s,a)=>s+(a.value||0),0);R.total=R.solUsd+R.tokUsd;
 log('reading history…');const sigs=await rpc('getSignaturesForAddress',[addr,{limit:1000}]);R.sigs=sigs;R.nSig=sigs.length;R.more=sigs.length===1000;
 R.newest=sigs[0]?.blockTime||null;R.oldest=sigs[sigs.length-1]?.blockTime||null;R.spanDays=R.newest&&R.oldest?Math.max(1/24,(R.newest-R.oldest)/86400):0;R.perDay=R.nSig&&R.spanDays?R.nSig/Math.max(1,R.spanDays):0;
 R.ageDays=R.oldest?(Date.now()/1000-R.oldest)/86400:0;R.idleDays=R.newest?(Date.now()/1000-R.newest)/86400:null;R.failRate=R.nSig?sigs.filter(s=>s.err).length/R.nSig:0;
 log(`parsing ${Math.min(14,sigs.length)} recent transactions…`);R.txs=[];
 for(const s of sigs.slice(0,14)){try{const tx=await rpc('getTransaction',[s.signature,{encoding:'jsonParsed',maxSupportedTransactionVersion:1,commitment:'confirmed'}]);if(tx)R.txs.push(parseTx(tx,addr,s))}catch(e){}}
 R.progs={};R.txs.forEach(t=>t.programs.forEach(p=>{R.progs[p]=(R.progs[p]||0)+1}));
 return R}
function parseTx(tx,addr,s){const keys=tx.transaction.message.accountKeys.map(k=>typeof k==='string'?{pubkey:k}:k);const idx=keys.findIndex(k=>k.pubkey===addr);const signer=idx>=0&&keys[idx].signer;
 const pre=tx.meta?.preBalances?.[idx]||0,post=tx.meta?.postBalances?.[idx]||0;const fee=signer&&idx===0?tx.meta.fee:0;
 const ins=[...tx.transaction.message.instructions,...(tx.meta?.innerInstructions||[]).flatMap(x=>x.instructions)];
 const programs=[...new Set(tx.transaction.message.instructions.map(i=>i.programId))].map(p=>PROG[p]||p);
 const memos=ins.filter(i=>(i.program==='spl-memo')||PROG[i.programId]?.startsWith('Memo')).map(i=>typeof i.parsed==='string'?i.parsed:'').filter(Boolean);
 const transfers=ins.filter(i=>i.program==='system'&&i.parsed?.type==='transfer').map(i=>i.parsed.info);
 const tokDelta=[];const pt=tx.meta?.preTokenBalances||[],qt=tx.meta?.postTokenBalances||[];const own=b=>b.owner===addr;
 const mints=new Set([...pt.filter(own),...qt.filter(own)].map(b=>b.mint));mints.forEach(m=>{const a=+(pt.find(b=>own(b)&&b.mint===m)?.uiTokenAmount?.uiAmount||0),b=+(qt.find(b=>own(b)&&b.mint===m)?.uiTokenAmount?.uiAmount||0);if(a!==b)tokDelta.push({mint:m,d:b-a})});
 const named=programs.filter(p=>!PLUMB.has(p));let kind=named.length?named[0]:transfers.length?'Transfer':'Other';if(kind==='Jupiter'||kind.startsWith('Raydium')||kind==='Orca'||kind==='PumpSwap'||kind.startsWith('Meteora'))kind=tokDelta.length?'Swap · '+kind:kind;
 if(kind==='pump.fun')kind=tokDelta.some(t=>t.d>0)?'pump.fun buy':tokDelta.some(t=>t.d<0)?'pump.fun sell':'pump.fun';
 return{sig:s.signature,time:s.blockTime,err:!!s.err,signer,solDelta:(post-pre+ (idx===0?0:0))/1e9,fee:fee/1e9,programs,kind,memos,transfers,tokDelta}}

function classify(R){const p=R.progs,has=k=>p[k]||0;const pumpTx=has('pump.fun')+has('PumpSwap');const defiN=Object.keys(p).filter(k=>DEFI.has(k)).length;const nftN=Object.keys(p).filter(k=>NFTP.has(k)).length+R.accts.filter(a=>a.decimals===0&&a.ui>=1).length/5;
 const dust=R.accts.filter(a=>(a.ui===0)||(!a.verified&&(a.value||0)<0.01)).length;const pumpHeld=R.accts.filter(a=>a.pump&&a.ui>0).length;
 let c='normie';
 if(!R.exists&&R.nSig===0)c='shell';
 else if(R.nSig===0)c='shell';
 else if(R.ageDays<7&&!R.more)c='fresh';
 else if(R.perDay>150)c='bot';
 else if(R.total>100000)c='whale';
 else if(R.idleDays>60)c='ghost';
 else if(pumpTx>=3||(pumpHeld>=8&&R.perDay>3))c='degen';
 else if(defiN>=2)c='defi';
 else if(nftN>=3)c='nft';
 else if(dust>=15)c='rug';
 else if(R.ageDays>365&&R.perDay<1.5)c='diamond';
 const lvl=clamp(Math.floor(Math.sqrt(R.nSig*(R.more?3:1))*1.6+R.ageDays/45),1,99);
 const s=v=>clamp(Math.round(v),1,99);
 const st={HP:s(Math.log10(R.total+1)*16),SPD:s(Math.log10(R.perDay+1)*38),DEF:99,INT:s(10+defiN*14+Math.min(30,R.accts.filter(a=>a.verified).length*3)+(R.failRate<.05?10:0)),LCK:s(R.accts.length?(R.accts.filter(a=>a.value>1).length/R.accts.length)*90+5:20)};
 const mood=R.idleDays>30?'sad':R.total<5?'sad':R.perDay>20||R.total>1000?'happy':'idle';
 return{c,lvl,st,mood,pumpTx,defiN,nftN,dust,pumpHeld,xpFrac:((Math.sqrt(R.nSig)*1.6)%1)}}

function lookalike(a,b){return a!==b&&a.slice(0,4)===b.slice(0,4)&&a.slice(-4)===b.slice(-4)}
async function defend(addr,R,log){const F=[];const add=(sev,threat,obj,fix)=>F.push({sev,threat,obj,fix});
 if(R.exists&&R.owner!==SYS&&!R.executable){add('CRITICAL','Account is not owned by the System Program. Drainers "assign" wallets to their own program so they can move funds.',`owner ${short(R.owner,6)}`,null)}
 else add('OK','Wallet ownership is normal (System Program).','account',null);
 log('checking token approvals and authorities…');
 const accs=R.accts.filter(a=>a.ui>0||a.amount==='0').slice(0,600).map(a=>a.account);const parsed=new Map();for(let i=0;i<accs.length;i+=100){const ch=accs.slice(i,i+100);try{const r=await rpc('getMultipleAccounts',[ch,{encoding:'jsonParsed'}]);r.value.forEach((v,j)=>{if(v)parsed.set(ch[j],v)})}catch(e){log('authority read failed: '+e.message)}}
 let dels=0;R.accts.forEach(a=>{const v=parsed.get(a.account);const info=v?.data?.parsed?.info;if(!info)return;a.program=v.owner;
  if(info.delegate){dels++;add('HIGH',`Active spending approval: ${short(info.delegate,5)} can move up to ${num(info.delegatedAmount?.uiAmount,4)} ${esc(a.symbol||'tokens')}.`,a.symbol||short(a.mint),{type:'revoke',account:a.account,program:v.owner,label:'Revoke'})}
  if(info.closeAuthority&&info.closeAuthority!==addr)add('HIGH','A different address can close this token account.',`${a.symbol||short(a.mint)} · ${short(info.closeAuthority,5)}`,null);
  if(info.state==='frozen')add('MEDIUM','Token account is frozen by the mint authority. You can\'t move these tokens.',a.symbol||short(a.mint),null)});
 if(!dels)add('OK','No active token spending approvals.','token accounts',null);
 log('checking Token-2022 mint extensions…');
 const t22=[...new Set(R.accts.filter(a=>parsed.get(a.account)?.owner===T22).map(a=>a.mint))];
 for(let i=0;i<t22.length;i+=100){try{const r=await rpc('getMultipleAccounts',[t22.slice(i,i+100),{encoding:'jsonParsed'}]);r.value.forEach((v,j)=>{const info=v?.data?.parsed?.info;if(!info)return;const ex=(info.extensions||[]).map(e=>e.extension);const a=R.accts.find(x=>x.mint===t22[i+j]);const nm=a?.symbol||short(t22[i+j]);
  if(ex.includes('permanentDelegate'))add('HIGH','Token has a permanent delegate: its issuer can move or burn your balance at any time.',nm,null);
  if(ex.includes('transferHook'))add('MEDIUM','Token runs a transfer hook program on every transfer.',nm,null);
  if(info.freezeAuthority&&!a?.verified)add('LOW','Unverified Token-2022 coin with a live freeze authority.',nm,null)})}catch(e){}}
 log('scanning token names for phishing…');
 const bad=/(https?:|www\.|\.com|\.io|\.net|\.xyz|t\.me|claim|airdrop|reward|visit|voucher|redeem|gift)/i;
 R.accts.forEach(a=>{const s=`${a.name||''} ${a.symbol||''}`;if(bad.test(s)&&!a.verified)add('HIGH','Phishing-style token: name tells you to visit a site or claim a reward. Don\'t interact with it.',esc(s.trim()).slice(0,40),{type:'burn',account:a.account,program:a.programId,mint:a.mint,amount:a.amount,decimals:a.decimals,label:'Burn & close'})});
 log('checking recent memos and dust transfers…');
 const sentTo=new Set();R.txs.forEach(t=>t.transfers.forEach(x=>{if(x.source===addr)sentTo.add(x.destination)}));
 R.txs.forEach(t=>{t.memos.forEach(m=>{if(bad.test(m)&&!t.signer)add('HIGH','Phishing memo in an incoming transaction.',esc(m).slice(0,48),null)});
  t.transfers.forEach(x=>{if(x.destination===addr&&x.lamports<1e6){const look=[...sentTo].find(d=>lookalike(d,x.source));add(look?'HIGH':'LOW',look?`Address poisoning: dust from ${short(x.source,5)}, which looks like ${short(look,5)} you sent to before. Never copy addresses from history.`:`Dust transfer (${(x.lamports/1e9).toFixed(6)} SOL) from ${short(x.source,5)}.`,short(t.sig,6),null)}})});
 log('listing programs you signed for…');
 const signed={};R.txs.filter(t=>t.signer).forEach(t=>t.programs.forEach(p=>{signed[p]=(signed[p]||0)+1}));
 Object.entries(signed).filter(([p])=>!PLUMB.has(p)).forEach(([p,n])=>add(p.length>30?'INFO':'OK',p.length>30?'You signed for a program Hashling doesn\'t recognise. Make sure you meant to.':'You signed for a well-known program.',`${p.length>30?short(p,6):p} · ${n}×`,null));
 const w={CRITICAL:40,HIGH:15,MEDIUM:6,LOW:2,INFO:1,OK:0};const score=clamp(100-F.reduce((s,f)=>s+w[f.sev],0),0,100);
 const order=['CRITICAL','HIGH','MEDIUM','LOW','INFO','OK'];F.sort((a,b)=>order.indexOf(a.sev)-order.indexOf(b.sev));return{F,score}}
async function fixIx(fx){const W=await w3();const owner=new W.PublicKey(WAL.pk);const prog=new W.PublicKey(fx.program||TOKEN);const acct=new W.PublicKey(fx.account);
 if(fx.type==='revoke')return[new W.TransactionInstruction({programId:prog,keys:[{pubkey:acct,isSigner:false,isWritable:true},{pubkey:owner,isSigner:true,isWritable:false}],data:Uint8Array.of(5)})];
 if(fx.type==='close')return[closeIx(W,prog,acct,owner)];
 if(fx.type==='burn'){const ixs=[];if(fx.amount&&fx.amount!=='0'){const d=new Uint8Array(9);d[0]=8;let n=BigInt(fx.amount);for(let i=1;i<9;i++){d[i]=Number(n&255n);n>>=8n}ixs.push(new W.TransactionInstruction({programId:prog,keys:[{pubkey:acct,isSigner:false,isWritable:true},{pubkey:new W.PublicKey(fx.mint),isSigner:false,isWritable:true},{pubkey:owner,isSigner:true,isWritable:false}],data:d}))}ixs.push(closeIx(W,prog,acct,owner));return ixs}}
function closeIx(W,prog,acct,owner){return new W.TransactionInstruction({programId:prog,keys:[{pubkey:acct,isSigner:false,isWritable:true},{pubkey:owner,isSigner:false,isWritable:true},{pubkey:owner,isSigner:true,isWritable:false}],data:Uint8Array.of(9)})}

  const pr=ep.slotIndex/ep.slotsInEpoch;b.querySelector('#nP').style.width=(pr*100).toFixed(1)+'%';b.querySelector('#nPt').textContent=`epoch ${ep.epoch} · ${(pr*100).toFixed(1)}% · ~${Math.round((ep.slotsInEpoch-ep.slotIndex)*0.4/3600)}h left`;b.querySelector('#nB').textContent='block height '+num(ep.blockHeight,0);
  $('#nmS').textContent='Updated '+new Date().toLocaleTimeString();$('#nmV').textContent='core '+(ver['solana-core']||'—');$('#trSlot').textContent='slot '+num(ep.absoluteSlot,0);this.draw(w)}catch(e){$('#nmS').textContent='RPC busy: '+e.message}},
 draw(w){const c=w.body.querySelector('#nC');if(!c||!w.samp)return;const r=c.getBoundingClientRect();const W=Math.round(r.width/2),H=Math.round(r.height/2);c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#0b0b10';g.fillRect(0,0,W,H);
  const mx=Math.max(...w.samp.map(s=>s.t))*1.1;g.fillStyle='#16303a';for(let i=1;i<5;i++)g.fillRect(0,Math.round(H*i/5),W,1);for(let i=1;i<10;i++)g.fillRect(Math.round(W*i/10),0,1,H);
  const line=(k,col)=>{g.fillStyle=col;let py=null;w.samp.forEach((s,i)=>{const x=Math.round(i/(w.samp.length-1)*(W-1)),y=Math.round(H-2-(s[k]/mx)*(H-6));if(py!==null){const a=Math.min(py,y),b=Math.max(py,y);g.fillRect(x,a,1,b-a+1)}g.fillRect(x,y,2,1);py=y})};line('t','#2fd27a');line('n','#ffd23f');
  g.fillStyle='#8aa';g.font='8px monospace';g.fillText(Math.round(mx)+' tps',2,9);g.fillText('60 min',W-30,H-3)}
});

app('term',{title:'Command Prompt',w:600,h:380,x:340,y:120,
 init(w){w.body.innerHTML=`<div class="term"><div class="out" id="tO"></div><div class="ln"><span>C:\\HASHLING&gt;</span><input id="tI" spellcheck="false" autocomplete="off" aria-label="command"></div></div>`;const O=w.body.querySelector('#tO'),In=w.body.querySelector('#tI');w.hist=[];w.hi=0;
  const p=(t,c='')=>{O.insertAdjacentHTML('beforeend',`<div class="${c}">${t}</div>`);O.scrollTop=1e9};w.p=p;p('Hashling Command Prompt · real data from Solana mainnet');p('Type <span class="c">help</span> for commands.','d');

  In.onkeydown=async e=>{if(e.key==='Enter'){const v=In.value.trim();In.value='';if(!v)return;w.hist.push(v);w.hi=w.hist.length;p('C:\\HASHLING&gt; '+esc(v),'d');beep(900,.02);try{await this.cmd(w,v)}catch(er){p('error: '+esc(er.message),'e')}}if(e.key==='ArrowUp'){w.hi=Math.max(0,w.hi-1);In.value=w.hist[w.hi]||''}if(e.key==='ArrowDown'){w.hi=Math.min(w.hist.length,w.hi+1);In.value=w.hist[w.hi]||''}};setTimeout(()=>In.focus(),50)},
 async cmd(w,v){const p=w.p;const [c,...a]=v.split(/\s+/);const arg=a[0]||(WAL&&WAL.pk);switch(c.toLowerCase()){
  case 'help':p(['<span class="c">balance</span> [addr]    SOL balance','<span class="c">tokens</span> [addr]     top token holdings','<span class="c">scan</span> [addr]       hatch it in Hashling','<span class="c">defend</span> [addr]     run Defender','<span class="c">txs</span> [addr]        last 10 signatures','<span class="c">price</span> &lt;mint|sol&gt;  live price','<span class="c">tps</span> / <span class="c">slot</span> / <span class="c">epoch</span>   network stats','<span class="c">open</span> &lt;app&gt;       hashling, defender, rugbin, send, net, token','<span class="c">connect</span> / <span class="c">whoami</span> / <span class="c">clear</span>'].join('\n'));break;
  case 'clear':w.body.querySelector('#tO').innerHTML='';break;
  case 'whoami':p(WAL?`${WAL.name} · ${WAL.pk}`:'not connected');break;
  case 'connect':connect(pk=>p('connected '+pk,'y'));break;
  case 'balance':{if(!isAddr(arg))throw new Error('usage: balance <address>');const r=await rpc('getBalance',[arg]);await solPrice();p(`${(r.value/1e9).toFixed(6)} SOL${SOLUSD?'  ≈ '+usd(r.value/1e9*SOLUSD):''}`,'y');break}
  case 'tokens':{if(!isAddr(arg))throw new Error('usage: tokens <address>');p('reading…','d');const R=await scan(arg,()=>{});const L=[...R.accts].filter(x=>x.ui>0).sort((x,y)=>(y.value||0)-(x.value||0)).slice(0,10);p(L.map(x=>`${(x.symbol||short(x.mint)).padEnd(10)} ${num(x.ui,2).padStart(16)}  ${usd(x.value).padStart(9)}`).join('\n')||'no tokens','y');break}
  case 'txs':{if(!isAddr(arg))throw new Error('usage: txs <address>');const s=await rpc('getSignaturesForAddress',[arg,{limit:10}]);p(s.map(x=>`${ago(x.blockTime).padStart(4)}  ${x.err?'FAIL':' ok '}  ${x.signature.slice(0,32)}…`).join('\n')||'none','y');break}
  case 'scan':if(!isAddr(arg))throw new Error('usage: scan <address>');open('hashling',arg);p('opening Hashling…','d');break;
  case 'defend':if(!isAddr(arg))throw new Error('usage: defend <address>');open('defender',arg);p('opening Defender…','d');break;
  case 'price':{const m=(a[0]||'').toLowerCase()==='sol'||!a[0]?SOLM:a[0];const j=await getJSON(API.price+m);const x=j[m];if(!x)throw new Error('no price for that mint');const meta=(await tokenMeta([m]))[0];p(`${meta?.symbol||short(m)}  $${x.usdPrice.toPrecision(6)}  ${x.priceChange24h!=null?(x.priceChange24h>=0?'+':'')+x.priceChange24h.toFixed(2)+'% 24h':''}`,'y');break}
  case 'tps':{const s=await rpc('getRecentPerformanceSamples',[1]);p(`${num(s[0].numTransactions/s[0].samplePeriodSecs,0)} tps (${num((s[0].numNonVoteTransactions||0)/s[0].samplePeriodSecs,0)} non-vote)`,'y');break}
  case 'slot':p(num(await rpc('getSlot',[]),0),'y');break;
  case 'epoch':{const e=await rpc('getEpochInfo',[]);p(`epoch ${e.epoch} · ${(e.slotIndex/e.slotsInEpoch*100).toFixed(2)}% · block ${num(e.blockHeight,0)}`,'y');break}
  case 'open':if(!APPS[a[0]])throw new Error('apps: '+Object.keys(APPS).join(', '));open(a[0]);break;
  case 'sudo':p('nice try. this pet only listens to its owner.','e');break;
  default:p(`'${esc(c)}' is not recognised. Type help.`,'e')}}
});
